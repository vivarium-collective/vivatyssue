[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tyssue"
authors = [
  { name = "Guillaume Gay", email = "guillaume@damcb.com" },
  { name = "all Tyssue contributors"}
]
maintainers = [
  { name = "Tasnif Rahman", email = "tasnif.rahman@gmail.com" },
]
description = "tyssue is a living tissues, cell level, modeling library"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  # "Typing :: Typed",
]
license.file = "LICENSE"
dynamic = ["version"]

# Runtime requirements. These previously lived only in requirements.txt and
# environment.yml, neither of which the build backend reads, so an install from
# PyPI produced an unimportable package. Everything below is imported
# unconditionally on the `import tyssue` path.
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "pandas>=1.5",
  "matplotlib>=3.5",
  "networkx>=2.6",       # core/objects.py
  "meshio>=5.0",         # io/meshes.py
  "quantities>=0.13",    # dynamics/units.py
  "scikit-image>=0.19",  # geometry/planar_geometry.py, reached by `import tyssue`
  "tables>=3.7",         # pandas HDFStore backend, used by HistoryHdf5
  "ipywidgets>=7.6",     # draw/plt_draw.py, utils/widgets.py
]

[project.optional-dependencies]
# Interactive / WebGL rendering. Heavy, and not needed for headless simulation
# or for the matplotlib drawing in tyssue.draw.plt_draw.
viz = [
  "ipyvolume",
  "pythreejs",
  "vispy",
  "jupyter",
  "notebook",
]
# tyssue.io.zarr degrades gracefully without these.
zarr = [
  "zarr",
  "xarray",
]
test = [
  "nox",
  "pytest",
  "pytest-cov",
  "nbval",
]
dev = [
  "pytest",
  "pytest-cov",
  "pre-commit",
  "nbval",
]
docs = [
  "Sphinx",
  "myst_parser",
  "sphinx-book-theme",
  "sphinx_copybutton",
]

[project.urls]
Homepage = "https://github.com/vivarium-collective/vivatyssue"
"Bug Tracker" = "https://github.com/vivarium-collective/vivatyssue/issues"
Discussions = "https://github.com/vivarium-collective/vivatyssue/discussions"
Changelog = "https://github.com/vivarium-collective/vivatyssue/releases"
"Upstream project" = "https://github.com/DamCB/tyssue"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/tyssue/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tyssue"]

[tool.hatch.build.targets.sdist]
# Explicit allow-list. An exclude-based sdist swept in the doc/notebooks
# submodule (tyssue-demo, ~143 MB of gifs and pngs) plus doc/illus and
# doc/examples, producing a 150 MB archive -- over PyPI's 100 MB file limit.
# Docs and demo notebooks live in the repo, not in the release artifact.
include = [
  "/src/tyssue",
  "/tests",
  "/README.md",
  "/INSTALL.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/CITATION.cff",
  "/changelog.md",
  "/Makefile",
  "/pytest.ini",
  "/pyproject.toml",
]

[tool.mypy]
files = "src"
python_version = "3.10"
warn_unused_configs = true
strict = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true


[tool.flake8]
max-line-length = 88
ignore = ["W605", "W503", "E203"]


[tool.ruff]
select = [
  "E", "F", "W", # flake8
  "B",  "B904",  # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
]
extend-ignore = ["PLR", "E501"]
target-version = "py310"
src = ["src"]
unfixable = ["T20", "F841"]

[tool.ruff.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]


[tool.pylint]
py-version = "3.10"
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "wrong-import-position",
]
