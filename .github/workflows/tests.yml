name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ImageMagick is a system binary, not a Python package, and conda-forge
      # has no win-64 build. The gif tests skip themselves on Windows via
      # tyssue.draw.plt_draw.imagemagick_cmd().
      - name: Install ImageMagick (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick

      # Installing from pip only is deliberate: it is the honest test of whether
      # [project.dependencies] is complete, which conda-based CI could not catch.
      # The zarr extra is installed so tyssue.io.zarr is actually exercised.
      # The viz extra is deliberately not: vispy and ipyvolume need a GL/Qt
      # canvas, and those tests skip themselves on a headless runner anyway.
      - name: Install tyssue
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,zarr]"

      - name: Test
        run: python -m pytest tests -ra
